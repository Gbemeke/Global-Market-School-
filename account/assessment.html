<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Assessment — Global Market School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy-deep:#0b1b33; --navy-mid:#12233f; --ivory:#f4efe0; --paper:#faf7ee;
  --gold:#b28e4c; --gold-bright:#d6b568; --hair:rgba(178,142,76,0.28);
  --ink:#1c2333; --ink-soft:#4a5468; --good:#3f7a5c; --bad:#8a3b2e;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden; max-width:100%;}
body{font-family:'EB Garamond', Georgia, serif; background:var(--paper); color:var(--ink); line-height:1.7;}
a{color:inherit;}
.wrap{max-width:720px;margin:0 auto;padding:0 24px;}
header{background:var(--paper); border-bottom:1px solid var(--hair);}
.brand-row{display:flex; align-items:center; justify-content:space-between; padding-top:20px; padding-bottom:20px; flex-wrap:wrap; gap:8px 12px;}
.brand{display:flex; align-items:center; gap:10px; font-family:'Cinzel', serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--navy-deep); text-decoration:none;}
.brand .mark{width:26px;height:26px;border-radius:50%; border:1.5px solid var(--gold); display:flex;align-items:center;justify-content:center; font-family:'Cormorant Garamond',serif; font-weight:600; font-size:8.1px; color:var(--gold); letter-spacing:-0.2px;}
.nav-cta{font-family:'Cinzel', serif; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; text-decoration:none; color:var(--paper); background:var(--navy-deep); padding:10px 18px; border:1px solid var(--navy-deep); white-space:nowrap; flex-shrink:0;}
.hero{padding:32px 0 8px;}
.tier-badge{display:inline-block; font-family:'Cinzel', serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--navy-deep); background:var(--ivory); border:1px solid var(--gold); padding:6px 12px; margin-bottom:16px;}
.hero h1{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:clamp(26px,4.2vw,34px); color:var(--navy-deep); margin-bottom:12px;}
.hero p{font-size:16px; color:var(--ink-soft);}
#loading{padding:60px 0; text-align:center; color:var(--ink-soft); font-style:italic;}
.msg{font-size:14px; padding:14px 16px; margin:20px 0; border-left:3px solid; display:none;}
.msg.error{background:#fbf0ee; border-color:var(--bad); color:var(--bad); display:block;}
.msg.success{background:#eaf3ee; border-color:var(--good); color:var(--good); display:block;}
.already-box{background:#fff; border:1px solid var(--hair); padding:32px 26px; margin:32px 0; text-align:center;}
.already-box h3{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:22px; color:var(--navy-deep); margin-bottom:10px;}
.already-box p{font-size:15px; color:var(--ink-soft); margin-bottom:20px;}
.q-block{background:#fff; border:1px solid var(--hair); padding:24px 22px; margin:20px 0;}
.q-block .q-num{font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:8px;}
.q-block .q-text{font-size:17px; color:var(--ink); margin-bottom:16px;}
.q-option{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid var(--hair); cursor:pointer;}
.q-option:first-of-type{border-top:none;}
.q-option input{margin-top:4px; accent-color:var(--gold);}
.q-option span{font-size:15.5px;}
.submit-row{margin:32px 0 60px;}
.btn-primary{
  font-family:'Cinzel', serif; font-size:13px; letter-spacing:1.5px; text-transform:uppercase;
  background:var(--navy-deep); color:var(--ivory); border:1px solid var(--navy-deep); padding:15px 28px; cursor:pointer;
  text-decoration:none; display:inline-block;
}
.btn-primary:hover{background:var(--gold); border-color:var(--gold); color:var(--navy-deep);}
.btn-primary:disabled{opacity:0.6; cursor:not-allowed;}
.result-box{background:var(--navy-deep); color:var(--ivory); padding:36px 30px; margin:32px 0; text-align:center;}
.result-box h3{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:26px; margin-bottom:12px;}
.result-box.pass h3{color:var(--gold-bright);}
.result-box p{font-size:16px; color:rgba(244,239,224,0.85); margin-bottom:20px;}
footer{background:var(--navy-mid); color:rgba(244,239,224,0.5); text-align:center; padding:28px 0; font-size:12.5px; margin-top:40px;}
</style>
</head>
<body>

<header>
  <div class="wrap brand-row">
    <a href="../index.html" class="brand"><span class="mark">GMS</span>Global Market School</a>
    <a href="dashboard.html" class="nav-cta">Dashboard</a>
  </div>
</header>

<div class="wrap">
  <div id="loading">Loading assessment…</div>

  <div id="content" style="display:none;">
    <div class="hero">
      <span class="tier-badge" id="tier-badge"></span>
      <h1 id="quiz-title"></h1>
      <p id="quiz-sub"></p>
    </div>

    <p class="msg" id="msg"></p>

    <div id="already-block" style="display:none;"></div>

    <form id="quiz-form" style="display:none;">
      <div id="questions"></div>
      <div class="submit-row">
        <button type="submit" class="btn-primary" id="submit-btn">Submit Assessment</button>
      </div>
    </form>

    <div id="result-block"></div>
  </div>
</div>

<footer>&copy; Global Market School</footer>

<script>
  const supabaseClient = supabase.createClient(
    'https://djkctbtxnpdkstvznjlf.supabase.co',
    'sb_publishable_4J_RxGdtTL8Uip1cn6XCVg_kdOTcyK8'
  );

  // Question text and options are fetched from the database at load time
  // (assessment_questions_public) -- the correct answers are never sent
  // to the browser at all, and grading itself happens inside a database
  // function (submit_assessment) that the client only ever calls. This
  // closes the gap where a client-computed score could previously be
  // written straight to the certificates table by anyone calling the
  // REST API directly.

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  let currentUser = null;
  let tierKey = null;
  let tierConfig = null;
  let questions = [];

  async function init() {
    tierKey = getParam('tier');
    if (!tierKey) {
      document.getElementById('loading').textContent = 'Unknown assessment. Please return to your Dashboard.';
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = session.user;

    const { data: tier, error: tierErr } = await supabaseClient
      .from('assessment_tiers')
      .select('*')
      .eq('tier_key', tierKey)
      .single();

    if (tierErr || !tier) {
      document.getElementById('loading').textContent = 'Unknown assessment. Please return to your Dashboard.';
      return;
    }
    tierConfig = tier;

    const { data: qRows } = await supabaseClient
      .from('assessment_questions_public')
      .select('position, question, options')
      .eq('tier_key', tierKey)
      .order('position');
    questions = qRows || [];

    // This is a UX convenience only -- the real enrollment check happens
    // server-side inside submit_assessment(), which cannot be bypassed
    // by skipping this client-side gate.
    const { data: access } = await supabaseClient
      .from('course_access')
      .select('course_key')
      .eq('user_id', currentUser.id)
      .eq('has_access', true);
    const unlockedKeys = (access || []).map(a => a.course_key);
    const hasAccess = tierConfig.required_courses.every(k => unlockedKeys.includes(k));

    if (!hasAccess) {
      document.getElementById('loading').textContent = 'You need to be enrolled in this class to take its assessment.';
      return;
    }

    // Already certified? Show the existing certificate instead of re-quizzing.
    const { data: existing } = await supabaseClient
      .from('certificates')
      .select('certificate_number, score, issued_at')
      .eq('user_id', currentUser.id)
      .eq('tier', tierKey)
      .order('issued_at', { ascending: false })
      .limit(1);

    document.getElementById('tier-badge').textContent = tierConfig.badge;
    document.getElementById('quiz-title').textContent = tierConfig.label + ' Assessment';

    if (existing && existing.length) {
      document.getElementById('quiz-sub').textContent = 'You already passed this assessment.';
      const box = document.getElementById('already-block');
      box.style.display = 'block';
      box.innerHTML =
        '<div class="already-box">' +
          '<h3>You\'re Already Certified</h3>' +
          '<p>You passed the ' + tierConfig.label + ' assessment with a score of ' + Math.round(existing[0].score * 100) + '%.</p>' +
          '<a href="certificate.html?id=' + encodeURIComponent(existing[0].certificate_number) + '" class="btn-primary">View Your Certificate</a>' +
        '</div>';
    } else {
      document.getElementById('quiz-sub').textContent = 'Answer all ' + questions.length + ' questions. You need ' + Math.round(tierConfig.pass_score * 100) + '% to pass and earn your certificate.';
      renderQuiz();
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  function renderQuiz() {
    const container = document.getElementById('questions');
    container.innerHTML = questions.map(function (item, qi) {
      return '<div class="q-block">' +
        '<div class="q-num">Question ' + (qi + 1) + ' of ' + questions.length + '</div>' +
        '<div class="q-text">' + item.question + '</div>' +
        item.options.map(function (opt, oi) {
          return '<label class="q-option"><input type="radio" name="q' + qi + '" value="' + oi + '" required><span>' + opt + '</span></label>';
        }).join('') +
        '</div>';
    }).join('');
    document.getElementById('quiz-form').style.display = 'block';
  }

  document.getElementById('quiz-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.className = 'msg';
    msg.textContent = '';
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Grading…';

    const answers = questions.map(function (item, qi) {
      const picked = document.querySelector('input[name="q' + qi + '"]:checked');
      return picked ? Number(picked.value) : -1;
    });

    // Grading itself happens inside this database call -- the browser
    // never computes or sees its own score before the server does.
    const { data: result, error } = await supabaseClient.rpc('submit_assessment', {
      p_tier: tierKey,
      p_answers: answers
    });

    if (error || !result) {
      msg.className = 'msg error';
      msg.textContent = 'Could not submit your assessment. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Submit Assessment';
      return;
    }

    const resultBlock = document.getElementById('result-block');

    if (!result.passed) {
      resultBlock.innerHTML =
        '<div class="result-box">' +
          '<h3>' + Math.round(result.score * 100) + '% — Not Quite</h3>' +
          '<p>You need ' + Math.round(tierConfig.pass_score * 100) + '% to pass. Review the lessons and try again whenever you\'re ready.</p>' +
          '<button type="button" class="btn-primary" onclick="window.location.reload()">Try Again</button>' +
        '</div>';
      document.getElementById('quiz-form').style.display = 'none';
      btn.disabled = false;
      btn.textContent = 'Submit Assessment';
      return;
    }

    document.getElementById('quiz-form').style.display = 'none';
    resultBlock.innerHTML =
      '<div class="result-box pass">' +
        '<h3>' + Math.round(result.score * 100) + '% — You Passed!</h3>' +
        '<p>Congratulations — you\'ve earned your ' + tierConfig.label + ' certificate of completion.</p>' +
        '<a href="certificate.html?id=' + encodeURIComponent(result.certificate_number) + '" class="btn-primary">View Your Certificate</a>' +
      '</div>';
  });

  init();
</script>

</body>
</html>
