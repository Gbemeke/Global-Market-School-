name: Deploy static site to GitHub Pages

# Deploys the repo as-is (plain static HTML/CSS/JS, no Jekyll) using
# GitHub's Actions-based Pages pipeline instead of the legacy
# "Deploy from a branch" auto-workflow, which was getting stuck on
# its deploy step.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove .git before packaging
        run: rm -rf .git

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
